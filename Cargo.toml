[package]
name = "lodestar"
version = "0.1.0"
edition = "2021"
description = "Lodestar — authoritative DNS server + zone admin for the Steadholme stack."
license = "MIT OR Apache-2.0"

[lib]
name = "lodestar"
path = "src/lib.rs"

[[bin]]
name = "lodestar"
path = "src/main.rs"

[dependencies]
# Vendored Odyssey canonical CSS (font + tokens + shared components) for server-rendered pages.
odyssey = { path = "crates/odyssey" }
# HTTP framework for the admin dashboard (shared with keystone/inkwell/sanctum): Form/State/Path/
# Json extractors, typed responses, server-rendered HTML.
axum = "0.8"
# Async runtime axum runs on. The Store trait is async: handlers `.await` it directly and PgStore
# drives sqlx natively, so a worker thread is NEVER blocked (no block_in_place, no sync-over-async).
# The DNS server (`net` UDP+TCP), the periodic zone reload (`time`), and the audit emitter all
# `tokio::spawn` their own background tasks.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "time"] }
# Erase the async Store trait methods so `Arc<dyn Store>` stays object-safe (same seam as the rest
# of the estate; a fresh InMemoryStore drops in for tests).
async-trait = "0.1"
# Deserialize the urlencoded record add/delete form bodies + serialize the /api/records JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ergonomic error/store enums -> branded HTML error page.
thiserror = "2"
# Structured logging.
tracing = "0.1"
tracing-subscriber = "0.3"
# Epoch -> UTC components for the "created" timestamps (std only — no extra C deps). Same crate the
# rest of the estate pins.
time = { version = "0.3", default-features = false, features = ["std"] }
# CSPRNG bytes for the double-submit CSRF token + record/zone ids. `getrandom` is a tiny libc-backed
# shim and `hex` encodes the bytes (both already used by inkwell/watchtower).
getrandom = "0.2"
hex = "0.4"
# Portable PostgreSQL data layer. Runtime queries only (sqlx::query/Row) — NO compile-time macros,
# so the build needs NO database. rustls TLS (ring) — no openssl. Standard SQL only, so the same
# statements later run unchanged on FusionDB over pgwire.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }

[dev-dependencies]
# ServiceExt::oneshot drives the Router in-process for the end-to-end tests (no port bind).
tower = { version = "0.5", features = ["util"] }
